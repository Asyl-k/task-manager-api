name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: ./mvnw -B verify

  docker-smoke:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the application health check
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Smoke test the API
        run: |
          curl -fsS -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-user","password":"password123"}' > /tmp/token.json
          TOKEN=$(jq -r '.accessToken' /tmp/token.json)
          test -n "$TOKEN"
          curl -fsS -X POST http://localhost:8080/api/tasks \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI smoke test"}' > /tmp/task.json
          jq -e '.id != null and .status == "TODO"' /tmp/task.json
      - name: Stop the stack
        if: always()
        run: docker compose down -v
