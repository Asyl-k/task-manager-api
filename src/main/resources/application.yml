spring:
  application:
    name: task-manager-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
